name: 部署到 GitHub Pages

# 推到 main 就重新构建并部署到 https://<用户>.github.io/<仓库>/
# 站点源码里的链接都是根路径，而 Pages 的项目站点挂在子路径下，
# 所以构建之后要多做一步：用 scripts/prefix-dist.mjs 加上仓库名前缀。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 内容校验与单元测试
        run: pnpm test

      - name: 构建并冒烟
        run: pnpm verify

      - name: 按子路径改写链接
        run: |
          set -euo pipefail
          node scripts/prefix-dist.mjs /tarot-site
          touch dist/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
